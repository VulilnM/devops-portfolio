server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all non-existent paths -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM files must have the correct MIME type
    location ~ \.wasm$ {
        add_header Content-Type application/wasm;
    }
}